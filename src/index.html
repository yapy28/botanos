<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/src/assets/favicon.svg" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOTANOS — Find Your Plant</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/src/assets/sparnatural-form.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/src/assets/sparnatural-form.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f0;
            color: #2d3e2d;
        }
        header {
            background: #2d5a2d;
            color: white;
            padding: 1.5rem 2rem;
        }
        header h1 { margin: 0; font-size: 1.8rem; }
        header p { margin: 0.3rem 0 0 0; opacity: 0.8; font-size: 0.95rem; }
        .search-bar {
            padding: 1rem 2rem;
            background: white;
            border-bottom: 1px solid #ddd;
        }
        .search-bar input {
            width: 100%;
            max-width: 500px;
            padding: 0.6rem 1rem;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        .search-bar .results {
            margin-top: 0.5rem;
            max-width: 500px;
        }
        .search-bar .results a {
            display: block;
            padding: 0.5rem 1rem;
            color: #2d5a2d;
            text-decoration: none;
            border-bottom: 1px solid #eee;
        }
        .search-bar .results a:hover { background: #f0f5f0; }
        .category-cards {
            display: flex;
            gap: 1rem;
            padding: 1rem 2rem;
            flex-wrap: wrap;
        }
        .category-cards .card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 1rem 1.5rem;
            cursor: pointer;
            font-size: 0.95rem;
            transition: box-shadow 0.2s;
        }
        .category-cards .card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        #sparnatural-container {
            padding: 1rem 2rem;
            background: white;
            margin: 0;
        }
        #results-container {
            padding: 1rem 2rem;
        }
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }
        .plant-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: box-shadow 0.2s, transform 0.2s;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .plant-card:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            transform: translateY(-2px);
        }
        .plant-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #f5f5f0;
        }
        .plant-card .card-body {
            padding: 1rem;
        }
        .plant-card .card-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0;
        }
        .plant-card .card-sci {
            font-style: italic;
            color: #888;
            font-size: 0.9rem;
            margin: 0.2rem 0 0 0;
        }
        .plant-card .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: 0.6rem;
        }
        .plant-card .card-tag {
            background: #e8f0e8;
            color: #2d5a2d;
            border-radius: 12px;
            padding: 0.2rem 0.6rem;
            font-size: 0.78rem;
        }
        .plant-card .card-tag-toxic {
            background: #fde8e8;
            color: #c44;
            border-radius: 12px;
            padding: 0.2rem 0.6rem;
            font-size: 0.78rem;
        }
        .plant-card .card-tag-safe {
            background: #e8f5e8;
            color: #2a8;
            border-radius: 12px;
            padding: 0.2rem 0.6rem;
            font-size: 0.78rem;
        }
        .plant-card .card-meta {
            font-size: 0.82rem;
            color: #666;
            margin-top: 0.5rem;
        }
        .results-table a { color: #2d5a2d; text-decoration: none; }
        .results-table a:hover { text-decoration: underline; }
        .main-layout {
            display: flex;
            gap: 1.5rem;
            padding: 1rem 2rem;
            align-items: flex-start;
        }
        .sidebar {
            flex: 0 0 350px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 1rem;
        }
        .sidebar h3 {
            margin: 0 0 0.5rem 0;
            font-size: 1rem;
            color: #2d5a2d;
        }
        .content-area {
            flex: 1;
            min-width: 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>BOTANOS</h1>
        <p>Find plants that thrive in your environment</p>
    </header>

    <div class="search-bar">
        <input type="text" id="plant-search" placeholder="Search by plant name (e.g. Monstera, Areca Palm)..." autocomplete="off">
        <div class="results" id="search-results"></div>
    </div>

    <!--
    <div class="category-cards" id="category-cards">
        <span style="color:#888; font-size:0.9rem; align-self:center;">Quick filter:</span>
        <div class="card" onclick="setFilter('IndoorOutdoor_3', 'https://w3id.org/botanos/Indoor')">Indoor plants</div>
        <div class="card" onclick="setFilter('IndoorOutdoor_3', 'https://w3id.org/botanos/Outdoor')">Outdoor plants</div>
        <div class="card" onclick="setFilter('LightRequirement_4', 'https://w3id.org/botanos/FullShade')">Low light</div>
        <div class="card" onclick="setFilter('LightRequirement_4', 'https://w3id.org/botanos/BrightIndirect')">Bright indirect</div>
        <div class="card" onclick="setFilter('PlantCategory_15', 'https://w3id.org/botanos/Tropical')">Tropical</div>
        <div class="card" onclick="setFilter('PlantCategory_15', 'https://w3id.org/botanos/Succulent')">Succulents</div>
    </div>
    -->

    <div class="main-layout">
        <div class="sidebar">
            <h3>Filters</h3>
            <sparnatural-form
                id="botanos-form"
                src="/ontology/shacl/botanos-shapes.ttl"
                form="/src/assets/form-specification.json"
                query="/src/assets/form-query.json"
                endpoint="http://localhost:7019"
                lang="en"
                defaultLang="en"
                limit="100"
            ></sparnatural-form>
        </div>
        <div class="content-area">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                <p style="margin:0; color:#666; font-size:0.9rem;" id="result-count"></p>
                <div style="display:flex; align-items:center; gap:0.5rem;">
                    <label for="limit-select" style="font-size:0.85rem; color:#666;">Show:</label>
                    <select id="limit-select" style="padding:0.25rem 0.5rem; border-radius:6px; border:1px solid #ccc;">
                        <option value="50">50</option>
                        <option value="100">100</option>
                        <option value="500">500</option>
                    </select>
                </div>
            </div>
            <div id="results-container">
                <p style="color:#888; padding:2rem; text-align:center;">Loading plants...</p>
            </div>
        </div>
    </div>

    <script>
        const ENDPOINT = 'http://localhost:7019';

        // Search bar — autocomplete plant names
        const searchInput = document.getElementById('plant-search');
        const searchResults = document.getElementById('search-results');
        let searchTimeout;

        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            const query = searchInput.value.trim();
            if (query.length < 2) {
                searchResults.innerHTML = '';
                return;
            }
            searchTimeout = setTimeout(() => doSearch(query), 300);
        });

        async function doSearch(query) {
            const sparql = `
PREFIX botanos: <https://w3id.org/botanos/>
PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
SELECT DISTINCT ?plant ?label ?sciName WHERE {
  ?plant a botanos:PlantSpecies ;
         rdfs:label ?label ;
         botanos:scientificName ?sciName .
  FILTER(REGEX(STR(?label), "${query}", "i") || REGEX(STR(?sciName), "${query}", "i"))
}
LIMIT 10`;
            try {
                const res = await fetch(`${ENDPOINT}?query=${encodeURIComponent(sparql)}`, {
                    headers: { 'Accept': 'application/sparql-results+json' }
                });
                const data = await res.json();
                searchResults.innerHTML = '';
                for (const row of data.results.bindings) {
                    const qid = row.plant.value.split('/').pop();
                    const a = document.createElement('a');
                    a.href = `species.html?id=${qid}`;
                    a.textContent = `${row.label.value} (${row.sciName.value})`;
                    a.addEventListener('click', (e) => { e.preventDefault(); window.location.href = a.href; });
                    searchResults.appendChild(a);
                }
            } catch (e) {
                console.error('Search error:', e);
            }
        }

        // Category cards — pre-fill form filters
        function setFilter(variable, value) {
            const form = document.getElementById('botanos-form');
            // Sparnatural-form pre-filling via URL params
            const url = new URL(window.location);
            url.searchParams.set(variable, value);
            window.location.href = url.toString();
        }

        // Listen for form submit and display results
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('botanos-form');
            const limitSelect = document.getElementById('limit-select');
            let currentQuery = '';

            // Load all plants on page load
            loadAllPlants();

            // Reload when limit changes
            limitSelect.addEventListener('change', () => {
                if (currentQuery) {
                    runQuery(currentQuery);
                } else {
                    loadAllPlants();
                }
            });

            async function loadAllPlants() {
                const limit = limitSelect.value;
                const sparql = `
PREFIX botanos: <https://w3id.org/botanos/>
PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
SELECT DISTINCT ?PlantSpecies_1 ?ScientificName_2 ?IndoorOutdoor_3 ?LightRequirement_4 ?TempMin_5 ?TempMax_6 ?SoilPhMin_7 ?SoilPhMax_8 ?SoilHumidity_9 ?AirHumidity_10 ?WateringType_11 ?WateringFrequency_12 ?MatureHeightMin_13 ?MatureHeightMax_14 ?PlantCategory_15 ?ToxicTo_16 WHERE {
  ?PlantSpecies_1 a botanos:PlantSpecies ;
    botanos:scientificName ?ScientificName_2 .
  OPTIONAL { ?PlantSpecies_1 botanos:indoorOutdoor ?IndoorOutdoor_3 . }
  OPTIONAL { ?PlantSpecies_1 botanos:lightRequirement ?LightRequirement_4 . }
  OPTIONAL { ?PlantSpecies_1 botanos:tempMin ?TempMin_5 . }
  OPTIONAL { ?PlantSpecies_1 botanos:tempMax ?TempMax_6 . }
  OPTIONAL { ?PlantSpecies_1 botanos:soilPhMin ?SoilPhMin_7 . }
  OPTIONAL { ?PlantSpecies_1 botanos:soilPhMax ?SoilPhMax_8 . }
  OPTIONAL { ?PlantSpecies_1 botanos:soilHumidity ?SoilHumidity_9 . }
  OPTIONAL { ?PlantSpecies_1 botanos:airHumidity ?AirHumidity_10 . }
  OPTIONAL { ?PlantSpecies_1 botanos:wateringType ?WateringType_11 . }
  OPTIONAL { ?PlantSpecies_1 botanos:wateringFrequency ?WateringFrequency_12 . }
  OPTIONAL { ?PlantSpecies_1 botanos:matureHeightMin ?MatureHeightMin_13 . }
  OPTIONAL { ?PlantSpecies_1 botanos:matureHeightMax ?MatureHeightMax_14 . }
  OPTIONAL { ?PlantSpecies_1 botanos:plantCategory ?PlantCategory_15 . }
  OPTIONAL { ?PlantSpecies_1 botanos:toxicTo ?ToxicTo_16 . }
}`;
                await runQuery(sparql, true);
            }

            async function runQuery(query, applyClientLimit) {
                const resultsDiv = document.getElementById('results-container');
                const countP = document.getElementById('result-count');
                resultsDiv.innerHTML = '<p>Loading...</p>';
                countP.textContent = '';
                try {
                    const res = await fetch(`${ENDPOINT}?query=${encodeURIComponent(query)}&format=json`, {
                        headers: { 'Accept': 'application/sparql-results+json' }
                    });
                    const data = await res.json();
                    // Count unique plants (deduplicated by Q-ID)
                    const uniqueQids = new Set();
                    for (const row of data.results.bindings) {
                        if (row['PlantSpecies_1']) {
                            uniqueQids.add(row['PlantSpecies_1'].value.split('/').pop());
                        }
                    }
                    const count = uniqueQids.size;
                    countP.textContent = count === 0 ? 'No plants found' : `Showing ${count} plant${count !== 1 ? 's' : ''}`;
                    await renderResults(data, resultsDiv, applyClientLimit ? parseInt(limitSelect.value) : 0);
                } catch (e) {
                    resultsDiv.innerHTML = '<p>Error loading results. Is QLever running on port 7019?</p>';
                    console.error('Query error:', e);
                }
            }

            if (form) {
                form.addEventListener('queryUpdated', (event) => {
                    currentQuery = event.detail.queryString;
                    console.log('SPARQL query updated:', currentQuery);
                });
                form.addEventListener('submit', async (event) => {
                    console.log('Submit with query:', currentQuery);
                    // Append limit to the query
                    const queryClean = currentQuery ? currentQuery.replace(/LIMIT\s+\d+/i, '') : '';
                    if (queryClean) {
                        await runQuery(queryClean, true);
                    }
                    form.enablePlayBtn();
                });
            }
        });

        // Fetch plant labels (common name) from QLever for a batch of Q-IDs
        async function fetchPlantLabels(qids) {
            if (qids.length === 0) return {};
            const values = qids.map(q => `<http://www.wikidata.org/entity/${q}>`).join(' ');
            const sparql = `
PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
PREFIX botanos: <https://w3id.org/botanos/>
SELECT ?plant ?label WHERE {
  VALUES ?plant { ${values} }
  ?plant rdfs:label ?label .
}`;
            try {
                const res = await fetch(`${ENDPOINT}?query=${encodeURIComponent(sparql)}&format=json`, {
                    headers: { 'Accept': 'application/sparql-results+json' }
                });
                const data = await res.json();
                const labels = {};
                for (const row of data.results.bindings) {
                    const qid = row.plant.value.split('/').pop();
                    labels[qid] = row.label.value;
                }
                return labels;
            } catch (e) {
                return {};
            }
        }

        // Fetch photo URLs from Wikidata for a batch of Q-IDs
        async function fetchPhotos(qids) {
            if (qids.length === 0) return {};
            const values = qids.map(q => `wd:${q}`).join(' ');
            const sparql = `
SELECT ?plant ?image WHERE {
  VALUES ?plant { ${values} }
  ?plant wdt:P18 ?image .
}`;
            try {
                const res = await fetch(`https://query.wikidata.org/sparql?query=${encodeURIComponent(sparql)}`, {
                    headers: { 'Accept': 'application/sparql-results+json' }
                });
                const data = await res.json();
                const photos = {};
                for (const row of data.results.bindings) {
                    const qid = row.plant.value.split('/').pop();
                    photos[qid] = row.image.value + '?width=400';
                }
                return photos;
            } catch (e) {
                return {};
            }
        }

        function skosLabel(uri) {
            if (!uri || !uri.startsWith('https://w3id.org/botanos/')) return uri || '';
            return uri.split('/').pop().replace(/([A-Z])/g, ' $1').trim();
        }

        async function renderResults(data, container, clientLimit) {
            if (!data.results || data.results.bindings.length === 0) {
                container.innerHTML = '<p>No plants found matching your criteria.</p>';
                return;
            }

            // Deduplicate by plant Q-ID (multi-valued properties produce multiple rows)
            const plants = {};
            for (const row of data.results.bindings) {
                if (!row['PlantSpecies_1']) continue;
                const qid = row['PlantSpecies_1'].value.split('/').pop();
                if (!plants[qid]) {
                    plants[qid] = {
                        qid,
                        sciName: row['ScientificName_2']?.value || '',
                        indoor: new Set(),
                        light: new Set(),
                        categories: new Set(),
                        toxicTo: new Set(),
                        tempMin: null,
                        tempMax: null,
                    };
                }
                if (row['IndoorOutdoor_3']) plants[qid].indoor.add(skosLabel(row['IndoorOutdoor_3'].value));
                if (row['LightRequirement_4']) plants[qid].light.add(skosLabel(row['LightRequirement_4'].value));
                if (row['PlantCategory_15']) plants[qid].categories.add(skosLabel(row['PlantCategory_15'].value));
                if (row['ToxicTo_16']) plants[qid].toxicTo.add(skosLabel(row['ToxicTo_16'].value));
                if (row['TempMin_5'] && !plants[qid].tempMin) plants[qid].tempMin = row['TempMin_5'].value;
                if (row['TempMax_6'] && !plants[qid].tempMax) plants[qid].tempMax = row['TempMax_6'].value;
            }

            let qids = Object.keys(plants);
            if (clientLimit && clientLimit > 0) {
                qids = qids.slice(0, clientLimit);
            }
            container.innerHTML = `<p>Found ${qids.length} plants. Loading photos...</p>`;

            // Fetch labels and photos in parallel
            const [labels, photos] = await Promise.all([
                fetchPlantLabels(qids),
                fetchPhotos(qids)
            ]);

            // Render cards
            const grid = document.createElement('div');
            grid.className = 'results-grid';
            for (const qid of qids) {
                const p = plants[qid];
                const name = labels[qid] || qid;
                const photo = photos[qid];
                const tags = [...p.categories, ...p.indoor].slice(0, 4);
                const tempStr = (p.tempMin || p.tempMax) ?
                    `${p.tempMin || '?'}-${p.tempMax || '?'}°C` : '';

                const card = document.createElement('a');
                card.className = 'plant-card';
                card.href = `species.html?id=${qid}`;

                let html = '';
                if (photo) {
                    html += `<img src="${photo}" alt="${name}" loading="lazy">`;
                } else {
                    html += `<img src="" alt="${name}" style="display:none;">`;
                    html += `<div style="width:100%;height:200px;background:#f5f5f0;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:3rem;"><i class="fa-solid fa-leaf"></i></div>`;
                }
                html += `<div class="card-body">`;
                html += `<p class="card-name">${name}</p>`;
                html += `<p class="card-sci">${p.sciName}</p>`;
                if (tags.length > 0) {
                    html += `<div class="card-tags">`;
                    for (const tag of tags) {
                        html += `<span class="card-tag">${tag}</span>`;
                    }
                    html += `</div>`;
                }
                if (p.toxicTo.size > 0) {
                    const toxicLabels = [...p.toxicTo];
                    const isNonToxic = toxicLabels.some(t => t.includes('Non'));
                    const tagClass = isNonToxic ? 'card-tag-safe' : 'card-tag-toxic';
                    html += `<div class="card-tags">`;
                    for (const t of toxicLabels) {
                        html += `<span class="${tagClass}">${isNonToxic ? '<i class="fa-solid fa-check"></i> ' : '<i class="fa-solid fa-skull"></i> '}Toxic: ${t}</span>`;
                    }
                    html += `</div>`;
                }
                if (tempStr) {
                    html += `<p class="card-meta">${tempStr}</p>`;
                }
                html += `</div>`;
                card.innerHTML = html;
                grid.appendChild(card);
            }
            container.innerHTML = '';
            container.appendChild(grid);
        }
    </script>
</body>
</html>
